<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A practice e-commerce store built with vanilla JavaScript. Demo only: no real payments.">
  <!-- STEP 02: the real title is set by JavaScript from APP_NAME (config.js). -->
  <title>Loading…</title>
  <!-- STEP 02: a tiny emoji favicon (no image file needed, and no 404 in the console). -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">

  <!-- STEP 34: apply the saved theme BEFORE the page paints, so there's no
       white flash in dark mode. This is the one tiny script that can't wait
       for our modules. It reads the same 'checkout-app:theme' key as theme.js. -->
  <script>
    try {
      const savedTheme = JSON.parse(localStorage.getItem('checkout-app:theme'));
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme =
        savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : prefersDark ? 'dark' : 'light';
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>

  <!-- STEP 03: all our styles. -->
  <link rel="stylesheet" href="css/style.css">

  <!-- STEP 05: type="module" lets main.js import our other files.
       Modules are deferred automatically, and only work over http:// —
       that's why we open this page with Live Server. -->
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- STEP 02: keyboard users can jump straight past the header. -->
  <a class="skip-link" href="#main" data-skip-link>Skip to main content</a>

  <!-- STEP 02: the header is the same on every page. -->
  <header class="site-header">
    <div class="site-header-inner">
      <!-- STEP 02: the brand logo: just the wordmark (text comes from APP_NAME). -->
      <a class="logo" href="#/" aria-label="Home">
        <span class="logo-text" data-app-name></span>
      </a>

      <!-- STEP 02: main navigation. -->
      <nav class="site-nav" aria-label="Main">
        <a class="site-nav-link" href="#/" data-nav-link>Shop</a>
        <a class="site-nav-link" href="#/wishlist" data-nav-link>
          Wishlist <span class="count-pill" data-wishlist-count hidden>0</span>
        </a>
        <a class="site-nav-link" href="#/orders" data-nav-link>Orders</a>
      </nav>

      <div class="site-header-actions">
        <!-- STEP 34: theme toggle. -->
        <button type="button" class="icon-button" data-action="toggle-theme" aria-label="Dark mode" aria-pressed="false">
          <!-- Moon shows in light mode, sun in dark mode (CSS decides which). -->
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>

        <!-- STEP 02: the cart button. STEP 21: its item-count badge. -->
        <button type="button" class="icon-button cart-button" data-action="open-cart"
          aria-label="Open cart, 0 items" aria-controls="cart-drawer" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="20" r="1.5"></circle>
            <circle cx="18" cy="20" r="1.5"></circle>
            <path d="M2.5 3h2.6l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21.5 7H6"></path>
          </svg>
          <span class="cart-button-badge" data-cart-count hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- STEP 02: every page is drawn inside <main> by router.js.
       tabindex="-1" lets JavaScript move focus here on each page change. -->
  <main id="main" class="site-main" tabindex="-1"></main>

  <!-- STEP 02: footer. -->
  <footer class="site-footer">
    <p>© <span data-current-year></span> <span data-app-name></span></p>
  </footer>

  <!-- STEP 23: the cart drawer (a dialog) and its dark backdrop. -->
  <div class="drawer-backdrop" data-drawer-backdrop hidden></div>
  <aside id="cart-drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title" hidden>
    <div class="drawer-header">
      <h2 class="drawer-title" id="cart-drawer-title" tabindex="-1">Your cart</h2>
      <button type="button" class="icon-button" data-action="close-drawer" data-autofocus aria-label="Close cart">
        <span aria-hidden="true">✕</span>
      </button>
    </div>
    <div class="drawer-body" data-drawer-body></div>
    <div class="drawer-footer" data-drawer-footer hidden></div>
  </aside>

  <!-- STEP 24: the "Are you sure?" dialog. -->
  <div class="modal" id="confirm-dialog" hidden>
    <div class="modal-backdrop" data-modal-backdrop></div>
    <div class="modal-panel" data-modal-panel role="alertdialog" aria-modal="true"
      aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
      <h2 class="modal-title" id="confirm-dialog-title" data-modal-title></h2>
      <p class="modal-message" id="confirm-dialog-message" data-modal-message></p>
      <div class="modal-actions">
        <button type="button" class="button button-ghost" data-modal-cancel data-autofocus>Cancel</button>
        <button type="button" class="button button-danger" data-modal-confirm>Yes</button>
      </div>
    </div>
  </div>

  <!-- STEP 22: toasts appear here. aria-live makes screen readers announce them. -->
  <div class="toast-region" data-toast-region role="status" aria-live="polite"></div>
</body>
</html>
