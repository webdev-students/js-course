<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Notes</h1>
      <form id="note-form">
        <label for="note-title">New note</label><br />
        <input id="note-title" name="title" type="text" required />
        <button type="submit" class="button">Add</button>
      </form>
      <ul id="note-list" class="list"></ul>
    </main>
  </body>
</html>
