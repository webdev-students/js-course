<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/main.js"></script>
    <style>
      .task-done span {
        color: var(--color-muted);
        text-decoration: line-through;
      }
      nav a[aria-current='page'] {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Tasks <span id="task-count" class="badge"></span></h1>
      <form id="task-form">
        <label for="task-input">New task</label>
        <input id="task-input" name="title" type="text" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <nav>
        <a href="#/">All</a> · <a href="#/active">Active</a> · <a href="#/done">Done</a>
      </nav>
      <ul id="task-list" class="list"></ul>
    </main>
  </body>
</html>
