<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 7</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="cart card">
        <h1>Your cart</h1>
        <ul class="list">
          <li class="cart-item" data-product-id="1" data-price="19.99" data-quantity="2">
            <span class="title">Wireless Mouse</span> × 2
            <button type="button" class="remove-button secondary">Remove</button>
          </li>
          <li class="cart-item" data-product-id="3" data-price="27" data-quantity="1">
            <span class="title">Desk Lamp</span> × 1
            <button type="button" class="remove-button secondary">Remove</button>
          </li>
          <li class="cart-item" data-product-id="5" data-price="12.5" data-quantity="3">
            <span class="title">Water Bottle</span> × 3
            <button type="button" class="remove-button secondary">Remove</button>
          </li>
        </ul>
        <p id="cart-total" class="price">Total: $104.48</p>
      </section>
    </main>
  </body>
</html>
