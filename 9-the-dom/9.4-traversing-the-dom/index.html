<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moving around the DOM</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Shop</h1>
      <ul id="product-grid" class="grid">
        <li class="product-card" data-product-id="1">
          <h3>Wireless Mouse</h3>
          <p class="price">$19.99</p>
          <button type="button" class="button">Add to cart</button>
        </li>
        <li class="product-card" data-product-id="3">
          <h3>Desk Lamp</h3>
          <p class="price">$27.00</p>
          <button type="button" class="button">Add to cart</button>
        </li>
      </ul>
      <p id="picked" class="muted"></p>
    </main>
  </body>
</html>
