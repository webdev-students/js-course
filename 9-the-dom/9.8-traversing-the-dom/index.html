<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traversing the DOM</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Traversing the DOM</h1>
      <ul class="grid" id="product-grid">
        <li class="product-card" data-product-id="1">
          <h3>Wireless Mouse</h3>
          <p class="price">$19.99</p>
          <button type="button" class="add-button">Add to cart</button>
        </li>
        <li class="product-card" data-product-id="3">
          <h3>Desk Lamp</h3>
          <p class="price">$27.00</p>
          <button type="button" class="add-button">Add to cart</button>
        </li>
        <li class="product-card" data-product-id="5">
          <h3>Water Bottle</h3>
          <p class="price">$12.50</p>
          <button type="button" class="add-button">Add to cart</button>
        </li>
      </ul>
    </main>
  </body>
</html>
