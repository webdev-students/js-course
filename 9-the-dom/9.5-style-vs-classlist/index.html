<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>style vs classList</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Today's deals</h1>
      <p id="note" class="message">Deals end at midnight.</p>
      <ul class="grid">
        <li class="product-card" data-stock="12"><h3>Wireless Mouse</h3><p class="price">$19.99</p></li>
        <li class="product-card" data-stock="0"><h3>Leather Wallet</h3><p class="price">$34.50</p></li>
        <li class="product-card" data-stock="8"><h3>Desk Lamp</h3><p class="price">$27.00</p></li>
      </ul>
    </main>
  </body>
</html>
