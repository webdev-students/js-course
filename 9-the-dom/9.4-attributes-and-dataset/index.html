<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attributes and dataset</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <article class="product-card" data-product-id="3" data-stock="0" data-category="home-decoration">
        <img
          id="product-image"
          src="https://dummyjson.com/image/160x160/f3ece3/7a5c3a?text=Desk+Lamp"
          alt="Product photo"
          width="160"
          height="160"
        />
        <h3>Desk Lamp</h3>
        <p class="price">$27.00</p>
        <a id="details-link" href="#">View details</a>
        <button id="buy-button" type="button">Add to cart</button>
      </article>
    </main>
  </body>
</html>
