<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Projects</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
    <style>
      .project-list {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        padding: 0;
        list-style: none;
      }
      .project-card h2 {
        margin: 0 0 8px;
      }
      .project-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0;
        list-style: none;
      }
      .project-tags li {
        padding: 2px 10px;
        border: 1px solid var(--color-border);
        border-radius: 999px;
        font-size: 0.85rem;
      }
      .project-links {
        display: flex;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <main></main>
  </body>
</html>
