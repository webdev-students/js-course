<!doctype html>
<html lang="en">
  <head>

    <title>Exercise 1</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <main class="card">
      <h1>Basket: <span id="count">0</span></h1>

          <option value="1">1</option>
          <option value="5">5</option>
          <option value="10">10</option>

      </p>
    </main>
