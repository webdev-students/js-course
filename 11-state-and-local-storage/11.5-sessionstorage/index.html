<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sessionStorage</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Delivery details</h1>
      <form id="delivery-form" novalidate>
        <p>
          <label for="field-fullName">Full name</label><br />
          <input id="field-fullName" name="fullName" type="text" autocomplete="name" />
        </p>
        <p>
          <label for="field-address">Address</label><br />
          <input id="field-address" name="address" type="text" autocomplete="street-address" />
        </p>
        <p>
          <label for="field-city">City</label><br />
          <select id="field-city" name="city">
            <option value="London">London</option>
            <option value="Athens">Athens</option>
            <option value="Edinburgh">Edinburgh</option>
          </select>
        </p>
        <button type="submit">Continue to payment</button>
      </form>
      <p id="draft-status" class="muted" role="status"></p>
    </main>
  </body>
</html>
