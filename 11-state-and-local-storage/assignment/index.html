<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <style>
      .note {
        padding: 0.75rem 1rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        background: var(--color-surface);
      }
      .note h3 {
        margin: 0 0 0.25rem;
      }
      .note p {
        margin: 0.25rem 0;
        white-space: pre-wrap;
      }
      .field-error {
        color: var(--color-danger);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Notes <span id="note-count" class="badge"></span></h1>
      <form id="note-form" class="card" novalidate>
        <p>
          <label for="note-title">Title</label><br />
          <input id="note-title" name="title" type="text" aria-describedby="title-error" />
        </p>
        <p id="title-error" class="field-error" hidden></p>
        <p>
          <label for="note-body">Note</label><br />
          <textarea id="note-body" name="body" rows="3" cols="40"></textarea>
        </p>
        <button type="submit">Save note</button>
      </form>
      <p>
        <label for="search">Search notes</label><br />
        <input id="search" type="search" />
      </p>
      <ul id="note-list" class="grid"></ul>
    </main>
  </body>
</html>
