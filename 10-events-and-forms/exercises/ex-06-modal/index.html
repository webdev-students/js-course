<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 6</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <style>
      .dialog {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .dialog[hidden] {
        display: none;
      }
      .dialog-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(15, 18, 26, 0.55);
      }
      .dialog-panel {
        position: relative;
        max-width: 22rem;
      }
      .no-scroll {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Cotton T-shirt</h1>
      <p><button type="button" id="open-button" class="secondary">Size guide</button></p>
    </main>
    <div id="size-dialog" class="dialog" hidden>
      <div class="dialog-backdrop"></div>
      <div class="dialog-panel card" role="dialog" aria-modal="true" aria-labelledby="size-title">
        <h2 id="size-title">Size guide</h2>
        <p>S: chest 86–91 cm · M: 96–101 cm · L: 106–111 cm</p>
        <p><a href="#measuring" id="measure-link">How to measure</a></p>
        <button type="button" id="close-button">Close</button>
      </div>
    </div>
  </body>
</html>
