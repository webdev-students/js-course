<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 1</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Wireless Mouse — $19.99</h1>
      <p>
        <button type="button" class="secondary" data-change="-1" aria-label="One less">−</button>
        <strong id="quantity">1</strong>
        <button type="button" class="secondary" data-change="1" aria-label="One more">+</button>
      </p>
      <p id="line-total">Total: $19.99</p>
    </main>
  </body>
</html>
