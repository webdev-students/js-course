<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Gallery</h1>
      <img id="photo" src="" alt="" width="240" height="160" />
      <p id="caption" class="muted"></p>
      <p>
        <button type="button" id="previous-button" class="secondary">Previous</button>
        <button type="button" id="next-button" class="secondary">Next</button>

      <p class="muted">Tip: use the arrow keys, Home and End.</p>
      <p>
        <label for="feedback">Feedback</label><br />
        <input id="feedback" type="text" />
      </p>
    </main>
