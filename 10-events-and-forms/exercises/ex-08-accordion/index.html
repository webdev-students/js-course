<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 8</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Delivery FAQ</h1>
      <p><button type="button" id="toggle-all" class="secondary">Expand all</button> <span id="open-count" class="muted">0 of 3 open</span></p>
      <div id="faq">
        <h3><button type="button" class="secondary" aria-expanded="false" aria-controls="answer-1">How long does delivery take?</button></h3>
        <p id="answer-1" hidden>Standard delivery takes about 5 days; express takes 2.</p>
        <h3><button type="button" class="secondary" aria-expanded="false" aria-controls="answer-2">Is delivery free?</button></h3>
        <p id="answer-2" hidden>Standard delivery is free on orders of $100 or more.</p>
        <h3><button type="button" class="secondary" aria-expanded="false" aria-controls="answer-3">Can I change my address?</button></h3>
        <p id="answer-3" hidden>Yes — until your order ships. Contact us with your order ID.</p>
      </div>
    </main>
  </body>
</html>
