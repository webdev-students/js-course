<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI patterns</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <p>
        <button type="button" id="theme-toggle" class="secondary" aria-pressed="false">Dark mode</button>
      </p>
      <h1 id="page-heading" tabindex="-1">Your cart</h1>
      <ul class="list">
        <li>Wireless Mouse × 2</li>
        <li>Desk Lamp × 1</li>
      </ul>
      <p>
        <button type="button" id="empty-cart-button">Empty cart</button>
        <button type="button" id="skip-button" class="secondary">Skip to heading</button>
      </p>
      <p id="status" class="muted" role="status"></p>
    </main>

    <div id="dialog" class="dialog" hidden>
      <div class="dialog-backdrop" data-close-dialog></div>
      <div class="dialog-panel card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title">Empty your cart?</h2>
        <p>This removes every item. You can't undo it.</p>
        <button type="button" id="confirm-button">Yes, empty it</button>
        <button type="button" id="cancel-button" class="secondary" data-close-dialog>Cancel</button>
      </div>
    </div>
  </body>
</html>
