<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyboard events</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Keyboard shortcuts</h1>
      <p>
        <label for="search-input">Search</label><br />
        <input id="search-input" type="search" />
      </p>
      <p class="muted">Press <kbd>/</kbd> to search, <kbd>?</kbd> for help.</p>
      <div id="help-panel" class="message" hidden>
        <strong>Shortcuts:</strong> <kbd>/</kbd> search · <kbd>?</kbd> help · <kbd>Esc</kbd> close
      </div>
    </main>
  </body>
</html>
