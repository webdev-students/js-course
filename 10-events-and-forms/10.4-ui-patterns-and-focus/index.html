<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI patterns</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .dialog-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(15, 18, 26, 0.5);
      }
      .dialog-backdrop[hidden] {
        display: none;
      }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Help</h1>
      <button type="button" id="faq-toggle" class="button secondary" aria-expanded="false" aria-controls="faq-answer">How long is delivery?</button>
      <p id="faq-answer" hidden>Standard delivery takes 3–5 days.</p>
      <p><button type="button" id="open-dialog" class="button">Empty cart</button></p>
    </main>
    <div id="dialog" class="dialog-backdrop" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title" tabindex="-1">Empty your cart?</h2>
        <p>This removes every item.</p>
        <button type="button" id="cancel-dialog" class="button secondary">Cancel</button>
      </div>
    </div>
  </body>
</html>
