<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-do list</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .done span {
        text-decoration: line-through;
        opacity: 0.6;
      }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>To-do list</h1>
      <form id="todo-form" novalidate>
        <label for="todo-input">New to-do</label><br />
        <input id="todo-input" name="title" type="text" aria-describedby="todo-error" />
        <button type="submit" class="button">Add</button>
        <p id="todo-error" class="message error" hidden></p>
      </form>
      <ul id="todo-list" class="list"></ul>
      <p id="todo-count" class="muted"></p>
    </main>
  </body>
</html>
