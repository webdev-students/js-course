<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The event object</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Choose a size</h1>
      <p>
        <button type="button" class="size-button secondary" data-size="S">Small</button>
        <button type="button" class="size-button secondary" data-size="M">Medium <strong>(popular)</strong></button>
        <button type="button" class="size-button secondary" data-size="L">Large</button>
      </p>
      <p>Chosen size: <strong id="chosen-size">none yet</strong></p>
    </main>
  </body>
</html>
