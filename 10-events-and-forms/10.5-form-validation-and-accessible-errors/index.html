<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form validation</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Create an account</h1>
      <form id="signup-form" novalidate>
        <p>
          <label for="field-fullName">Full name</label><br />
          <input id="field-fullName" name="fullName" type="text" autocomplete="name" aria-describedby="fullName-error" />
        </p>
        <p id="fullName-error" class="field-error" hidden></p>
        <p>
          <label for="field-email">Email</label><br />
          <input id="field-email" name="email" type="email" autocomplete="email" aria-describedby="email-error" />
        </p>
        <p id="email-error" class="field-error" hidden></p>
        <p>
          <label for="field-password">Password (at least 8 characters)</label><br />
          <input id="field-password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error" />
        </p>
        <p id="password-error" class="field-error" hidden></p>
        <button type="submit">Create account</button>
      </form>
      <p id="result" class="message success" role="status"></p>
    </main>
  </body>
</html>
