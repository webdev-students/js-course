<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timers</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1>Flash sale</h1>
      <p>Sale ends in <strong id="countdown">0:10</strong></p>
      <p>
        <button type="button" id="add-button">Add to cart</button>
        <button type="button" id="stop-button" class="secondary">Stop the clock</button>
      </p>
      <p id="toast" class="message success" hidden>Added to cart</p>
    </main>
  </body>
</html>
