<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 7</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <style>
      .field-error {
        color: var(--color-danger);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Share a product review</h1>
      <form id="review-form" novalidate>
        <p>
          <label for="title">Title</label><br />
          <input id="title" name="title" type="text" aria-describedby="title-error" />
        </p>
        <p id="title-error" class="field-error" hidden></p>
        <p>
          <label for="body">Review</label><br />
          <textarea id="body" name="body" rows="3" cols="40"></textarea>
        </p>
        <button type="submit">Share</button>
      </form>
      <p id="message" class="message" role="status" hidden></p>
      <ul id="shared-list" class="list"></ul>
    </main>
  </body>
</html>
